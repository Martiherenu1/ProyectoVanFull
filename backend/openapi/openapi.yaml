components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdReserva:
      name: id_reserva
      in: path
      required: true
      schema: { type: integer }
    IdRecorrido:
      name: id_recorrido
      in: path
      required: true
      schema: { type: integer }
    IdViaje:
      name: id_viaje
      in: path
      required: true
      schema: { type: integer }
    IdPago:
      name: id_pago
      in: path
      required: true
      schema: { type: integer }

  responses:
    NoAutenticado:
      description: Falta autenticación o el token es inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SinPermiso:
      description: El usuario no tiene permisos para esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    IniciarCheckout:
      type: object
      additionalProperties: false
      required: [importe, medio_pago, clave_solicitud]
      properties:
        importe: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 9999999999.99, multipleOf: 0.01 }
        medio_pago: { type: string, enum: [MERCADO_PAGO] }
        clave_solicitud: { type: string, format: uuid }

    CheckoutOut:
      type: object
      required: [pago, estado_checkout]
      properties:
        pago: { $ref: '#/components/schemas/Pago' }
        estado_checkout: { type: string, enum: [CREANDO, LISTO, INCIERTO] }
        checkout_url: { type: string, nullable: true, format: uri, description: Solo init_point oficial validado; nulo si no hay enlace seguro o el Pago ya fue decidido }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo: { type: string, example: CUPO_NO_DISPONIBLE }
            mensaje: { type: string, example: No hay cupo disponible para el viaje solicitado. }
            detalles: { type: object, additionalProperties: true }

    LoginRequest:
      type: object
      required: [identificador_acceso, password]
      properties:
        identificador_acceso: { type: string, example: pasajero@example.com }
        password: { type: string, format: password }

    TokenResponse:
      type: object
      required: [access_token, token_type, roles]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        roles:
          type: array
          items: { type: string, example: pasajero }

    PerfilPasajero:
      type: object
      properties:
        id_persona: { type: integer }
        nombre: { type: string }
        apellido: { type: string }
        dni: { type: string, readOnly: true }
        email: { type: string }
        telefono: { type: string }
        direccion: { type: string }
        categoria: { type: string }
        estado_habilitacion: { type: string, enum: [habilitado, suspendido, baja] }
        fotografia: { type: string }

    PerfilPasajeroUpdate:
      type: object
      description: Solo datos habilitados para autoservicio (el DNI queda excluido, RN-026).
      properties:
        email: { type: string }
        telefono: { type: string }
        direccion: { type: string }

    PasajeroAdmin:
      type: object
      description: Pasajero tal como lo ve administración (CU-013). Mismos datos que PerfilPasajero.
      properties:
        id_persona: { type: integer }
        nombre: { type: string }
        apellido: { type: string }
        dni: { type: string }
        email: { type: string }
        telefono: { type: string }
        direccion: { type: string }
        categoria: { type: string }
        estado_habilitacion: { type: string, enum: [habilitado, suspendido, baja] }
        fotografia: { type: string }

    PasajeroLista:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PasajeroAdmin' }
        total: { type: integer, description: Cantidad de coincidencias sin paginar. }

    PasajeroCreate:
      type: object
      additionalProperties: false
      required: [nombre, apellido, dni]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 80 }
        apellido: { type: string, minLength: 1, maxLength: 80 }
        dni: { type: string, minLength: 1, maxLength: 20 }
        email: { type: string, minLength: 1, maxLength: 120 }
        telefono: { type: string, minLength: 1, maxLength: 30 }
        direccion: { type: string, minLength: 1, maxLength: 200 }
        categoria: { type: string, minLength: 1, maxLength: 30, description: Texto libre; el catálogo está a confirmar. }

    PasajeroUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitir un campo lo deja sin cambios; null no está admitido.
      properties:
        nombre: { type: string, minLength: 1, maxLength: 80 }
        apellido: { type: string, minLength: 1, maxLength: 80 }
        dni: { type: string, minLength: 1, maxLength: 20 }
        email: { type: string, minLength: 1, maxLength: 120 }
        telefono: { type: string, minLength: 1, maxLength: 30 }
        direccion: { type: string, minLength: 1, maxLength: 200 }
        categoria: { type: string, minLength: 1, maxLength: 30 }

    ClienteCorporativo:
      type: object
      required: [id_cliente, razon_social, cuit, estado]
      properties:
        id_cliente: { type: integer }
        razon_social: { type: string }
        cuit: { type: string }
        direccion: { type: string }
        estado: { type: string, description: Solo existe `activo`; sin catálogo aprobado. }

    ClienteCorporativoLista:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ClienteCorporativo' }
        total: { type: integer, description: Cantidad de coincidencias sin paginar. }

    ClienteCorporativoDetalle:
      allOf:
        - $ref: '#/components/schemas/ClienteCorporativo'
        - type: object
          required: [contactos, pasajeros]
          properties:
            contactos:
              type: array
              items: { $ref: '#/components/schemas/ContactoCorporativo' }
            pasajeros:
              type: array
              items: { $ref: '#/components/schemas/PasajeroCorporativo' }

    ClienteCorporativoCreate:
      type: object
      additionalProperties: false
      required: [razon_social, cuit]
      properties:
        razon_social: { type: string, minLength: 1, maxLength: 150 }
        cuit: { type: string, minLength: 1, maxLength: 20, description: Formato no definido. }
        direccion: { type: string, minLength: 1, maxLength: 200 }

    ClienteCorporativoUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitir un campo lo deja sin cambios; null no está admitido.
      properties:
        razon_social: { type: string, minLength: 1, maxLength: 150 }
        cuit: { type: string, minLength: 1, maxLength: 20 }
        direccion: { type: string, minLength: 1, maxLength: 200 }

    ContactoCorporativo:
      type: object
      required: [id_persona, nombre, apellido, dni, es_representante]
      properties:
        id_persona: { type: integer }
        nombre: { type: string }
        apellido: { type: string }
        dni: { type: string }
        email: { type: string }
        telefono: { type: string }
        cargo: { type: string }
        es_representante: { type: boolean }

    ContactoCorporativoCreate:
      type: object
      additionalProperties: false
      description: |
        Una persona existente (`id_persona`, sin datos de persona) o una nueva (nombre, apellido y
        dni obligatorios, sin `id_persona`).
      properties:
        id_persona: { type: integer, minimum: 1 }
        nombre: { type: string, minLength: 1, maxLength: 80 }
        apellido: { type: string, minLength: 1, maxLength: 80 }
        dni: { type: string, minLength: 1, maxLength: 20 }
        email: { type: string, minLength: 1, maxLength: 120 }
        telefono: { type: string, minLength: 1, maxLength: 30 }
        cargo: { type: string, minLength: 1, maxLength: 80 }
        es_representante: { type: boolean, default: false }

    PasajeroCorporativo:
      type: object
      required: [id_persona, nombre, apellido, dni, estado_habilitacion, estado_vinculo]
      properties:
        id_persona: { type: integer }
        nombre: { type: string }
        apellido: { type: string }
        dni: { type: string }
        estado_habilitacion: { type: string, enum: [habilitado, suspendido, baja] }
        estado_vinculo: { type: string, description: Solo existe `activo`; sin catálogo aprobado. }

    PasajeroCorporativoCreate:
      type: object
      additionalProperties: false
      required: [id_pasajero]
      properties:
        id_pasajero: { type: integer, minimum: 1 }

    OrganizacionRepresentada:
      type: object
      required: [id_cliente, razon_social]
      properties:
        id_cliente: { type: integer }
        razon_social: { type: string }
        cargo: { type: string }

    OrganizacionLista:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrganizacionRepresentada' }
        total: { type: integer }

    PasajeroOrganizacion:
      type: object
      description: Pasajero de la organización tal como lo ve su representante (sin categoría ni fotografía).
      required: [id_persona, nombre, apellido, dni, estado_habilitacion]
      properties:
        id_persona: { type: integer }
        nombre: { type: string }
        apellido: { type: string }
        dni: { type: string }
        email: { type: string }
        telefono: { type: string }
        direccion: { type: string }
        estado_habilitacion: { type: string, enum: [habilitado, suspendido, baja] }

    PasajeroOrganizacionLista:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PasajeroOrganizacion' }
        total: { type: integer, description: Cantidad de pasajeros de la empresa sin paginar. }

    PasajeroOrganizacionCreate:
      type: object
      additionalProperties: false
      required: [nombre, apellido, dni]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 80 }
        apellido: { type: string, minLength: 1, maxLength: 80 }
        dni: { type: string, minLength: 1, maxLength: 20 }
        email: { type: string, minLength: 1, maxLength: 120 }
        telefono: { type: string, minLength: 1, maxLength: 30 }
        direccion: { type: string, minLength: 1, maxLength: 200 }

    PasajeroOrganizacionUpdate:
      type: object
      description: |
        Omitir un campo lo deja sin cambios; null no está admitido. Un campo que no figura acá (el DNI,
        por ejemplo) se acepta en el cuerpo pero se rechaza con 403 DATO_NO_MODIFICABLE.
      properties:
        nombre: { type: string, minLength: 1, maxLength: 80 }
        apellido: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, minLength: 1, maxLength: 120 }
        telefono: { type: string, minLength: 1, maxLength: 30 }
        direccion: { type: string, minLength: 1, maxLength: 200 }

    Deuda:
      type: object
      properties:
        saldo: { type: number, format: double, description: Saldo deudor derivado. }
        estado: { type: string, example: al_dia }

    Servicio:
      type: object
      properties:
        id_servicio: { type: integer }
        tipo_servicio: { type: string, enum: [UNIVERSITARIO, LABORAL, CORPORATIVO, ESPECIAL] }

    Parada:
      type: object
      properties:
        id_parada: { type: integer }
        orden: { type: integer }
        nombre_descripcion: { type: string }
        direccion: { type: string }
        latitud: { type: number, format: double }
        longitud: { type: number, format: double }
        comprometida: { type: boolean }

    Tarifa:
      type: object
      properties:
        id_tarifa: { type: integer }
        nombre: { type: string }
        importe: { type: number, format: double }
        tipo: { type: string }

    Disponibilidad:
      type: object
      properties:
        id_viaje: { type: integer }
        id_servicio: { type: integer }
        id_recorrido: { type: integer }
        fecha: { type: string, format: date }
        horario: { type: string, example: "07:30" }
        sentido: { type: string, enum: [IDA, VUELTA] }
        cupo_disponible: { type: integer, description: Derivado (capacidad - reservas). }

    ReservaCreate:
      type: object
      required: [id_viaje, orden_parada]
      properties:
        id_viaje: { type: integer }
        orden_parada: { type: integer, description: Parada de ascenso dentro del recorrido del viaje. }

    Reserva:
      type: object
      description: >-
        Una reserva con los datos del viaje que el pasajero necesita para reconocerla:
        `fecha`, `horario` y `sentido` son del viaje, no de la reserva. Los cuatro campos
        `id_recorrido`, `fecha`, `horario` y `sentido` se envían siempre.
      properties:
        id_reserva: { type: integer }
        id_pasajero: { type: integer }
        id_viaje: { type: integer }
        id_recorrido: { type: integer, description: "Recorrido del viaje; con `orden_parada` identifica la parada (GET /recorridos/{id}/paradas)." }
        orden_parada: { type: integer }
        fecha: { type: string, format: date, description: Fecha del viaje. }
        horario: { type: string, nullable: true, example: "07:30", description: "Horario del viaje (HH:MM). null si el viaje todavía no tiene horario." }
        sentido: { type: string, enum: [IDA, VUELTA], description: Sentido del viaje. }
        estado: { type: string, enum: [provisional, consolidada, cancelada] }

    ResultadoCancelacion:
      type: object
      description: >-
        Resultado de cancelar una reserva. Devuelve la reserva ya cancelada y la consecuencia
        económica que se aplicó según la ventana de cancelación (RN-017/018/019).
      properties:
        reserva:
          $ref: '#/components/schemas/Reserva'
        cupo_liberado: { type: boolean, description: "true si la cancelación devolvió el lugar al viaje." }
        penalidad_aplicada: { type: boolean, description: "true si se cobró cargo por cancelar fuera de término." }
        importe_penalidad: { type: number, format: double, description: "Importe del cargo. 0 si no hubo." }
        motivo: { type: string, description: "Por qué se aplicó o no la penalidad (la regla que decidió)." }

    AbordajeCreate:
      type: object
      required: [id_viaje, id_vehiculo]
      properties:
        id_viaje: { type: integer }
        id_vehiculo: { type: integer, description: Unidad identificada por el QR. }
        orden_parada: { type: integer }
        registrado_offline:
          type: boolean
          default: false
          description: true si se generó sin conexión y se sincroniza posteriormente (RNF-011/012).
        timestamp_local:
          type: string
          format: date-time
          description: Marca temporal local del escaneo (para sincronización offline).

    Abordaje:
      type: object
      properties:
        id_abordaje: { type: integer }
        id_pasajero: { type: integer }
        id_viaje: { type: integer }
        id_vehiculo: { type: integer }
        orden_parada: { type: integer }
        estado: { type: string, enum: [registrado, pendiente_sync, validado] }

    Ausencia:
      type: object
      properties:
        id_ausencia: { type: integer }
        id_pasajero: { type: integer }
        id_viaje: { type: integer }

    Ubicacion:
      type: object
      properties:
        id_viaje: { type: integer }
        latitud: { type: number, format: double }
        longitud: { type: number, format: double }
        fecha_hora_posicion: { type: string, format: date-time }
        fecha_hora_evaluacion:
          type: string
          format: date-time
          description: |
            Instante UTC S de evaluacion de esta respuesta fresca, calculado una sola vez
            sobre el mismo snapshot devuelto: desactualizada es true si y solo si
            S - fecha_hora_posicion supera estrictamente 30 segundos.
            No cambia fecha_hora_posicion ni la politica de recepcion GPS, no prueba la
            antiguedad fisica de captura ni indica recepcion del cliente.
            Propiedad opcional, no nullable: ausencia o referencia invalida no permiten
            crear un ancla temporal ni afirmar vigencia a partir de false.
        desactualizada: { type: boolean, description: true si supera 30 s de antigüedad (RNF-008). }
        eta_minutos: { type: integer, nullable: true, description: "Estimación de llegada, si disponible." }

    PosicionGpsCreate:
      type: object
      required: [latitud, longitud]
      properties:
        latitud:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitud:
          type: number
          format: double
          minimum: -180
          maximum: 180
        fecha_hora_posicion:
          type: string
          format: date-time
          description: |
            Marca temporal opcional del dispositivo, con zona horaria.
            Si se omite o es futura respecto del servidor, se usa la hora actual
            del servidor como timestamp efectivo. Si es anterior, se conserva.
            Solo se actualiza la posición si el timestamp efectivo es estrictamente
            posterior al almacenado; si es igual o anterior, se ignora la posición
            sin modificar las coordenadas ni el timestamp guardados.

    ResultadoPosicionGps:
      type: object
      required: [actualizada, fecha_hora_posicion]
      description: Resultado calculado del procesamiento; no incorpora columnas a posicion_gps.
      properties:
        actualizada:
          type: boolean
          description: true si la posición enviada se guardó; false si se ignoró y se conservó la almacenada.
        fecha_hora_posicion:
          type: string
          format: date-time
          description: Fecha/hora con zona horaria de la posición que efectivamente permanece almacenada.

    PagoCreate:
      type: object
      required: [importe, medio_pago]
      properties:
        id_cliente:
          type: integer
          description: Obligatorio para administración. El pasajero lo omite (se usa su cliente individual).
        importe: { type: number, format: double }
        medio_pago: { type: string, enum: [EFECTIVO, TRANSFERENCIA, BILLETERA, CUENTA_CORRIENTE, MERCADO_PAGO] }
        tipo: { type: string, enum: [total, parcial, senia], description: Tipo de pago cuando corresponda. }
        evidencia_pago:
          type: string
          description: >-
            Referencia o URL del respaldo que sube el pasajero (captura de la transferencia, por
            ejemplo). NO es la entidad COMPROBANTE del modelo relacional: esa la emite la empresa
            (recibo, factura, nota de crédito o de débito) y se genera recién al confirmar el pago.

    Pago:
      type: object
      properties:
        id_pago: { type: integer }
        id_cliente: { type: integer }
        importe: { type: number, format: double }
        medio_pago: { type: string }
        estado: { type: string, enum: [PENDIENTE, CONFIRMADO, RECHAZADO] }
        fecha_hora: { type: string, format: date-time }

    ComprobantePropio:
      type: object
      description: |
        Comprobante que emite la empresa (CU-035). La tabla `comprobante` solo guarda el tipo y
        exactamente un origen (MR-R28): `id_pago` para un RECIBO, `id_contratacion` para una
        FACTURA, `id_movimiento_cuenta` para una nota. Fecha, importe y medio son los del origen;
        no hay número, fecha de emisión ni datos fiscales propios del comprobante.
      required: [id_comprobante, tipo, id_pago, id_contratacion, id_movimiento_cuenta, fecha_hora, importe, medio_pago]
      properties:
        id_comprobante: { type: integer }
        tipo: { type: string, enum: [RECIBO, FACTURA, NOTA_DE_CREDITO, NOTA_DE_DEBITO] }
        id_pago: { type: integer, nullable: true, description: Origen de un RECIBO. }
        id_contratacion: { type: integer, nullable: true, description: Origen de una FACTURA. }
        id_movimiento_cuenta: { type: integer, nullable: true, description: Origen de una nota de crédito o de débito. }
        fecha_hora:
          type: string
          format: date-time
          nullable: true
          description: La del pago o la del movimiento. Una FACTURA no tiene, porque la contratación no guarda fecha.
        importe:
          type: number
          format: double
          nullable: true
          description: El del pago, el importe acordado de la contratación (puede faltar) o el del movimiento.
        medio_pago:
          type: string
          nullable: true
          description: Solo en un RECIBO, el medio del pago.

    OperacionAsignada:
      type: object
      required: [viaje, capacidad_planificada, paradas, pasajeros_con_reserva, integrantes_nomina, cantidades]
      properties:
        viaje:
          $ref: '#/components/schemas/Viaje'
        capacidad_planificada:
          type: integer
          minimum: 0
          nullable: true
          description: Valor de viaje.capacidad_planificada; no es cupo disponible.
        paradas:
          type: array
          description: Paradas de viaje.id_recorrido, ordenadas por orden ascendente.
          items:
            $ref: '#/components/schemas/Parada'
        pasajeros_con_reserva:
          type: array
          description: Pasajeros con reservas provisional o consolidada del viaje; excluye cancelada.
          items:
            $ref: '#/components/schemas/PasajeroOperacion'
        integrantes_nomina:
          type: array
          description: Integrantes registrados en la nómina del viaje, independientes del listado de reservas.
          items:
            $ref: '#/components/schemas/IntegranteNominaOperacion'
        cantidades:
          type: object
          required: [consolidadas, provisionales, total_reservas, total_nomina, abordajes_registrados]
          description: Cantidades operativas calculadas; no se calcula disponibilidad ni un total único entre listas.
          properties:
            consolidadas:
              type: integer
              minimum: 0
              description: Cantidad de reservas consolidadas en pasajeros_con_reserva.
            provisionales:
              type: integer
              minimum: 0
              description: Cantidad de reservas provisionales en pasajeros_con_reserva.
            total_reservas:
              type: integer
              minimum: 0
              description: Consolidadas más provisionales; tamaño de pasajeros_con_reserva.
            total_nomina:
              type: integer
              minimum: 0
              description: Tamaño de integrantes_nomina, independiente de total_reservas.
            abordajes_registrados:
              type: integer
              minimum: 0
              description: Pasajeros de pasajeros_con_reserva con abordaje_registrado true.

    PasajeroOperacion:
      type: object
      additionalProperties: false
      required: [id_reserva, id_pasajero, id_viaje, orden_parada, estado, nombre, apellido, dni, fotografia, abordaje_registrado]
      properties:
        id_reserva: { type: integer }
        id_pasajero: { type: integer }
        id_viaje: { type: integer }
        orden_parada: { type: integer }
        estado:
          type: string
          enum: [provisional, consolidada]
        nombre:
          type: string
          maxLength: 80
        apellido:
          type: string
          maxLength: 80
        dni:
          type: string
          maxLength: 20
        fotografia:
          type: string
          maxLength: 500
          nullable: true
          description: Referencia existente en pasajero.fotografia.
        abordaje_registrado:
          type: boolean
          description: |
            Existe un abordaje para el pasajero y el viaje.
            false significa que no hay registro; no acredita una ausencia.

    IntegranteNominaOperacion:
      type: object
      additionalProperties: false
      required: [id_integrante_nomina, nombre, apellido, dni]
      properties:
        id_integrante_nomina: { type: integer }
        nombre:
          type: string
          maxLength: 80
        apellido:
          type: string
          maxLength: 80
        dni:
          type: string
          maxLength: 20

    VehiculoCreate:
      type: object
      additionalProperties: false
      required: [patente, capacidad]
      properties:
        patente: { type: string, minLength: 1, maxLength: 10 }
        marca: { type: string, maxLength: 50, nullable: true }
        modelo: { type: string, maxLength: 50, nullable: true }
        capacidad: { type: integer, minimum: 1 }
        disponibilidad: { type: boolean, default: true }

    VehiculoUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        patente: { type: string, minLength: 1, maxLength: 10 }
        marca: { type: string, maxLength: 50, nullable: true }
        modelo: { type: string, maxLength: 50, nullable: true }
        capacidad: { type: integer, minimum: 1 }
        disponibilidad: { type: boolean }

    Vehiculo:
      type: object
      additionalProperties: false
      required: [id_vehiculo, patente, marca, modelo, capacidad, disponibilidad]
      properties:
        id_vehiculo: { type: integer }
        patente: { type: string, maxLength: 10 }
        marca: { type: string, maxLength: 50, nullable: true }
        modelo: { type: string, maxLength: 50, nullable: true }
        capacidad: { type: integer, minimum: 1 }
        disponibilidad: { type: boolean }

    ViajeCreate:
      type: object
      required: [id_servicio, id_recorrido, fecha, sentido]
      properties:
        id_servicio: { type: integer }
        id_recorrido: { type: integer }
        id_vehiculo: { type: integer, nullable: true }
        id_chofer: { type: integer, nullable: true }
        fecha: { type: string, format: date }
        horario: { type: string, example: "07:30" }
        sentido: { type: string, enum: [IDA, VUELTA] }
        capacidad_planificada: { type: integer }

    ViajeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        id_vehiculo: { type: integer, nullable: true }
        id_chofer: { type: integer, nullable: true }
        fecha: { type: string, format: date }
        horario: { type: string, nullable: true, example: "07:30" }
        sentido: { type: string, enum: [IDA, VUELTA] }
        capacidad_planificada: { type: integer, nullable: true, minimum: 0 }

    Viaje:
      type: object
      properties:
        id_viaje: { type: integer }
        id_servicio: { type: integer }
        id_recorrido: { type: integer }
        id_vehiculo: { type: integer, nullable: true }
        id_chofer: { type: integer, nullable: true }
        fecha: { type: string, format: date }
        horario: { type: string }
        sentido: { type: string, enum: [IDA, VUELTA] }
        estado: { type: string, enum: [programado, en_curso, finalizado, cancelado] }
        capacidad_planificada: { type: integer, nullable: true, minimum: 0 }

    ChatRequest:
      type: object
      required: [mensaje]
      properties:
        mensaje: { type: string, example: "¿Hay lugar para mañana a la mañana a CABA?" }
        conversacion_id: { type: string, nullable: true, description: Para continuar una conversación. }

    ChatResponse:
      type: object
      properties:
        respuesta: { type: string }
        conversacion_id: { type: string }
        derivar_humano: { type: boolean, description: true si el agente escaló a una persona (RF-032). }
        tool_usada: { type: string, nullable: true, description: "Tool invocada por el agente, si hubo." }

    AvisoCrear:
      type: object
      additionalProperties: false
      required:
      - clase
      - descripcion_interna
      - clave_solicitud
      properties:
        clase:
          type: string
          enum:
          - demora
          - problema
        descripcion_interna:
          type: string
          minLength: 1
          maxLength: 2000
        clave_solicitud:
          type: string
          format: uuid
    Aviso:
      type: object
      required:
      - id_evento_operativo
      - id_viaje
      - clase
      - descripcion_interna
      - id_cuenta_autora
      - clave_solicitud
      - fecha_hora_registro
      - registro
      - notificacion
      properties:
        id_evento_operativo:
          type: integer
          format: int64
        id_viaje:
          type: integer
          format: int64
        id_cuenta_autora:
          type: integer
          format: int64
        clase:
          type: string
          enum:
          - demora
          - problema
        descripcion_interna:
          type: string
        clave_solicitud:
          type: string
          format: uuid
        fecha_hora_registro:
          type: string
          format: date-time
        registro:
          type: string
          enum:
          - confirmado
        notificacion:
          type: string
          enum:
          - no_evaluada
    MensajeDemora:
      type: object
      required:
      - id_viaje
      properties:
        id_viaje:
          type: integer
          format: int64
        mensaje:
          type: string
          nullable: true
        fecha_hora_reporte:
          type: string
          format: date-time
          nullable: true
