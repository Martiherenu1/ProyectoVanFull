# Blueprint de Render: la API y el sitio web de la demo (Issues #116 y #122). Guía en DESPLIEGUE.md.
# Ningún secreto vive acá: DATABASE_URL y OPENROUTER_API_KEY se cargan en el panel de Render
# (sync: false los pide al crear el Blueprint) y JWT_SECRET lo genera Render.
services:
  - type: web
    name: vanfull-api
    runtime: docker
    plan: free
    # Misma región que la base de Neon (AWS us-east-2, Ohio). No se puede cambiar después.
    region: ohio
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Migra y después sirve: ver backend/arrancar.sh. Va en un script porque Render no parte el
    # dockerCommand como un shell (un `sh -c "…"` falló con exit 127, Issue #119).
    dockerCommand: sh arrancar.sh
    healthCheckPath: /api/health
    # Despliega solo cuando la CI de main está en verde, y solo si cambió el backend.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: ENV
        value: production
      - key: API_PREFIX
        value: /api
      # Los orígenes del sitio: el de Render (abajo) y GitHub Pages, de respaldo. Sin ruta ni barra
      # final: la ruta no es parte del origen. Si Render le agrega un sufijo al nombre, corregirlo acá.
      - key: CORS_ORIGINS
        value: https://vanfull.onrender.com,https://martiherenu1.github.io
      # Base64 de 256 bits al azar: supera los 32 bytes que exige core/security.py.
      - key: JWT_SECRET
        generateValue: true
      # Cadena de conexión DIRECTA de Neon (no la "-pooler"), tal como la da el panel.
      - key: DATABASE_URL
        sync: false
      # Opcional: sin clave, el asistente deriva a una persona de VanFull.
      - key: OPENROUTER_API_KEY
        sync: false

  # Flutter Web, en una URL sin el usuario de GitHub. Se compila en GitHub Actions (workflow Web, misma
  # versión de Flutter que la CI) y se publica en la rama `sitio-web`, que solo escribe ese workflow:
  # Render la sirve tal cual desde su CDN, sin compilar. Sin plan ni región: los sitios estáticos no
  # los tienen.
  - type: web
    name: vanfull
    runtime: static
    branch: sitio-web
    buildCommand: echo "Compilado en GitHub Actions (workflow Web)"
    staticPublishPath: ./
    autoDeployTrigger: commit
    # Sin esta regla, `/` daba 404 aunque index.html estaba publicado (Issue #125). Render no aplica
    # reglas a una ruta donde existe un archivo: main.dart.js y los assets se sirven igual.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
