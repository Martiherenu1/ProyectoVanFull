# Publica Flutter Web en GitHub Pages (Issue #116). Guía completa en DESPLIEGUE.md.
# Se corre a mano (Actions → Pages → Run workflow), así se elige qué sale después del freeze.
# Requiere: Settings → Pages → Source «GitHub Actions», y la variable del repo API_BASE_URL
# (Settings → Secrets and variables → Actions → Variables). No es secreta: queda en el JS publicado.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancela uno a medio publicar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build de Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}

    steps:
      - name: Verificar API_BASE_URL
        working-directory: .
        run: |
          case "$API_BASE_URL" in
            https://*/api) echo "API: $API_BASE_URL" ;;
            *) echo "::error::La variable API_BASE_URL tiene que ser https://<servicio>.onrender.com/api (está: '$API_BASE_URL')."; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      # La misma versión que la CI.
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Instalar dependencias
        run: flutter pub get --enforce-lockfile

      # Pages sirve el sitio en /<repositorio>/, no en la raíz del dominio.
      - name: flutter build web
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=API_BASE_URL="$API_BASE_URL"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

  deploy:
    name: Publicar en Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v4
