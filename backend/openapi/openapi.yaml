              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: No se puede finalizar un viaje programado o cancelado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # CHATBOT (AG-01)
  # ---------------------------------------------------------------------------
  /chat:
    post:
      tags: [chatbot]
      summary: Conversar con el agente AG-01
      description: |
        Punto de entrada del agente conversacional. El backend inyecta la fecha/hora y el
        contexto del usuario, orquesta las tools (que llaman a estos mismos endpoints) y
        deriva a humano cuando corresponde (RF-032). El agente NO inventa datos ni modifica
        pagos. (CU-011, RF-029/030/031/032)
      x-cu: CU-011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Respuesta del agente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'

  # ---------------------------------------------------------------------------
  # INTEGRACIONES
  # ---------------------------------------------------------------------------
  /pagos/mercadopago/checkout:
    post:
      tags: [pagos]
      summary: Iniciar Checkout Pro propio (candidato local desactivado)
      description: |
        PENDIENTE DE APROBACIÓN del equipo; extensión aislada de CU-014/CU-036.
        Solo pasajero autenticado con cliente y cuenta corriente existentes. Identidad
        obtenida de sesión; no admite id_cliente. MERCADO_PAGO no equivale a BILLETERA.
        Conserva Pago PENDIENTE e intención UUID antes del POST remoto. La misma clave
        por cliente no crea otro Pago ni repite POST: solo reconcilia la preferencia por GET.
        Un timeout conserva INCIERTO; no prueba rechazo. Checkout abandonado no acredita.
        Sin feature flag responde 404. No confirma por retorno ni acepta live_mode=true.
      x-cobertura: parcial
      x-estado-aprobacion: PENDIENTE DE VALIDACIÓN
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IniciarCheckout'
      responses:
        '200':
          description: Intención existente/lista, o Pago ya decidido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutOut' }
        '202':
          description: Resultado incierto; conservar clave y reconciliar sin nuevo POST remoto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutOut' }
        '400':
          description: VALIDACION; importe o método inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404':
          description: Cliente o cuenta corriente inexistentes; ruta inactiva sin habilitación
        '409':
          description: CHECKOUT_CLAVE_REUTILIZADA, CHECKOUT_ASOCIACION_AMBIGUA o CHECKOUT_ASOCIACION_INVALIDA
        '503':
          description: CHECKOUT_NO_DISPONIBLE; conservar la misma clave ante resultado incierto

  /pagos/mercadopago/retorno:
    get:
      tags: [pagos]
      summary: Retorno informativo de Checkout (candidato local desactivado)
      description: Página fija, sin sesión ni escrituras. Ignora estados y parámetros de URL; nunca acredita.
      x-cobertura: parcial
      x-estado-aprobacion: PENDIENTE DE VALIDACIÓN
      security: []
      responses:
        '200':
          description: Volver a VanFull y consultar el estado propio
          content:
            text/html:
              schema: { type: string }

  /pagos/{id_pago}:
    get:
      tags: [pagos]
      summary: Consultar estado del pago propio (candidato local desactivado)
      description: Solo pasajero propietario. Sin escrituras ni consulta externa; ruta ausente por defecto.
      x-cobertura: parcial
      x-estado-aprobacion: PENDIENTE DE VALIDACIÓN
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id_pago
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Estado local autoritativo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pago' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404':
          description: PAGO_NO_ENCONTRADO si no existe o pertenece a otro cliente

  /webhooks/mercadopago:
    post:
      tags: [integraciones]
      summary: Webhook de Mercado Pago (pruebas)
      description: |
        CANDIDATO D3/D6 EN RAMA AISLADA (seguimiento #215; propuesta previa #238/#240), PENDIENTE DE APROBACIÓN
        escrita de los tres integrantes. Desactivado por defecto, solo entorno
        local y PostgreSQL vf_test_/vf_sandbox_. Migración optativa fuera del head
        habitual de despliegue. No activado en main ni desplegado.
        Recibe exclusivamente payment con live_mode=false; el recurso Payments
        también debe tener live_mode=false. El pago ficticio conocido con
        live_mode=true sigue rechazado; no se infiere entorno por prefijo del token.
          Exige vínculo persistente previo, o intención Checkout propia persistida
          (solo con flag Checkout) cuya cadena Payments -> merchant order -> preferencia
          se comprueba por GET y UUID opaco generado por servidor; no id_pago inferido.
          Receptor/moneda configurados e importe coincidente. Valida HMAC-SHA256 y
          consulta GET /v1/payments/{id}. Puede vincular aprobación temprana antes de
          guardar la respuesta de creación de preferencia. Otra operación aprobada
          para el mismo Pago produce 409 y requiere conciliación, sin doble asiento.
        Cuando Mercado Pago informa válidamente que una operación fue aprobada
        o acreditada, el sistema actualiza automáticamente el pago correspondiente
        a CONFIRMADO, sin requerir una segunda validación humana.
        Los pagos cuyo medio no proporcione una acreditación automática válida
        continúan sujetos a confirmación administrativa según RN-015.
        ACK 200 vacío únicamente tras procesar/commit. Duplicados no repiten efectos;
        estados distintos de approved no confirman ni rechazan el pago local.
        Timeout transitorio permite nueva entrega; sin cola ni recuperación autónoma.
        Presupuesto propuesto 15 s, consulta 10 s, lock 2 s. Deshabilitado: ruta 404.
        (CU-036, RF-012, RN-015)
      x-cu: CU-036
      x-cobertura: parcial
      x-estado-aprobacion: PENDIENTE DE APROBACIÓN D1–D6 POR LOS TRES INTEGRANTES
      security: []
      parameters:
        - name: data.id
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]{1,64}$', maxLength: 64 }
        - name: x-request-id
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$', maxLength: 128 }
        - name: x-signature
          in: header
          required: true
          description: 'ts y v1 HMAC-SHA256 del manifest id:{data.id};request-id:{x-request-id};ts:{ts};. Ventana candidata 300 s.'
          schema: { type: string, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, live_mode, data]
              properties:
                type: { type: string, enum: [payment], maxLength: 32 }
                live_mode: { type: boolean, enum: [false] }
                data:
                  type: object
                  required: [id]
                  properties:
                    id:
                      oneOf:
                        - { type: string, pattern: '^[0-9]{1,64}$' }
                        - { type: integer, minimum: 0 }
                  additionalProperties: true
              additionalProperties: true
      responses:
        '200':
          description: Procesada, duplicada o no aprobada sin transición contable; cuerpo vacío
        '400':
          description: VALIDACION o WEBHOOK_INVALIDO; cuerpo/IDs/tópico/entorno inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: FIRMA_WEBHOOK_INVALIDA; autenticidad o ventana temporal inválida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: VINCULO_PAGO_INVALIDO; sin vínculo, estado local incompatible o recurso/importe/moneda/receptor/modo no válidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: PROVEEDOR_NO_DISPONIBLE o INTEGRACION_NO_DISPONIBLE; fallo transitorio/configuración/DB/timeout, sin ACK de éxito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: ERROR_INTERNO; rollback y mensaje sanitizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

