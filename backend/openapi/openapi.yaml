openapi: 3.0.3

# =============================================================================
# VanFull — Contrato de API REST (OpenAPI 3.0)
# =============================================================================
# Comunicación Vista-Controlador (Flutter/Agente <-> FastAPI). Cubre el requisito
# "Comunicación V-C: OpenAPI (JSON)" del PC1. Derivado de los 37 casos de uso
# (CU-001..CU-037) y del Modelo Relacional aprobado.
#
# Convenciones:
#  - Cada operación referencia su CU/RF/RN en la descripción y en x-cu.
#  - Las reglas de negocio (RN) se validan en el backend, no en el cliente.
#  - Autorización por rol (rol_acceso). Los agentes IA consumen estos mismos endpoints.
#  - Fechas ISO-8601; importes decimales; ids enteros.
# =============================================================================

info:
  title: VanFull API
  version: 0.1.0
  description: |
    API de gestión de viajes en micro de VanFull. Sirve a la app Flutter (Web/Mobile)
    y al agente conversacional AG-01 (vía tools). El backend es la autoridad de reglas
    de negocio, cupos, permisos y pagos.

servers:
  - url: http://localhost:8000/api
    description: Desarrollo local (docker-compose)

tags:
  - name: auth
    description: Autenticación y sesión (CU-012, RF-045)
  - name: pasajero
    description: Autoservicio del pasajero (CU-001, CU-006, CU-010)
  - name: chofer
    description: Operación asignada y ejecución del viaje por el chofer (CU-029, CU-030)
  - name: servicios
    description: Consulta de servicios, disponibilidad, recorridos y tarifas (CU-002)
  - name: reservas
    description: Reservas, cancelaciones y cambios de parada (CU-003/004/005)
  - name: abordaje
    description: Abordaje por QR y ausencias (CU-007, CU-008)
  - name: gps
    description: Ubicación y estimaciones del vehículo (CU-009)
  - name: pagos
    description: Registro y confirmación de pagos (CU-014, CU-016)
  - name: viajes
    description: Gestión operativa de viajes (CU-018) — administración
  - name: vehiculos
    description: Administración de vehículos (CU-022)
  - name: corporativo
    description: Representante de cliente corporativo, dentro de su organización (CU-033)
  - name: chatbot
    description: Agente conversacional AG-01 (CU-011)
  - name: integraciones
    description: Webhooks de sistemas externos (CU-036)

security:
  - bearerAuth: []

paths:

  # ---------------------------------------------------------------------------
  # AUTH
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión
      description: Autentica un usuario y devuelve un token de acceso. (CU-012, RF-045)
      x-cu: CU-012
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /auth/logout:
    post:
      tags: [auth]
      summary: Cerrar sesión
      description: Finaliza la sesión activa del usuario. (CU-012)
      x-cu: CU-012
      responses:
        '204':
          description: Sesión finalizada
        '401':
          $ref: '#/components/responses/NoAutenticado'

  # ---------------------------------------------------------------------------
  # PASAJERO (autoservicio)
  # ---------------------------------------------------------------------------
  /pasajeros/me:
    get:
      tags: [pasajero]
      summary: Consultar perfil propio
      description: Datos del pasajero autenticado y su estado de habilitación. (CU-001, RF-001/003)
      x-cu: CU-001
      responses:
        '200':
          description: Perfil del pasajero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilPasajero'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    patch:
      tags: [pasajero]
      summary: Modificar datos permitidos del perfil
      description: |
        Actualiza datos habilitados para autoservicio. El DNI NO es modificable por
        el pasajero (RN-026): debe hacerlo un administrador. (CU-001)
      x-cu: CU-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilPasajeroUpdate'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilPasajero'
        '403':
          description: Intento de modificar un dato no habilitado (p. ej. DNI, RN-026)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pasajeros:
    get:
      tags: [administracion]
      summary: Localizar pasajeros
      description: |
        Solo administrador y dueno. Lista paginada de pasajeros, con búsqueda opcional por DNI,
        nombre o apellido (`q`, sin distinguir mayúsculas). (CU-013, RF-002/042)
      x-cu: CU-013
      x-cobertura: parcial
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: desplazamiento
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Pasajeros que coinciden, con el total sin paginar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasajeroLista'
        '400':
          description: VALIDACION — parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags: [administracion]
      summary: Registrar un pasajero
      description: |
        Solo administrador y dueno. Crea la persona y el pasajero (estado `habilitado`); no crea
        cuenta de acceso. Un DNI ya registrado, aunque sea de otra persona (un chofer, por
        ejemplo), responde DNI_DUPLICADO. (CU-013, RF-002)
      x-cu: CU-013
      x-cobertura: parcial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasajeroCreate'
      responses:
        '201':
          description: Pasajero registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasajeroAdmin'
        '400':
          description: VALIDACION — datos inválidos o faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          description: DNI_DUPLICADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pasajeros/{id_persona}:
    parameters:
      - name: id_persona
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [administracion]
      summary: Consultar un pasajero
      description: Solo administrador y dueno. (CU-013, RF-042)
      x-cu: CU-013
      x-cobertura: parcial
      responses:
        '200':
          description: Datos y estado administrativo del pasajero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasajeroAdmin'
        '400':
          description: VALIDACION — identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: PASAJERO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [administracion]
      summary: Modificar un pasajero
      description: |
        Solo administrador y dueno. Cambia datos personales y categoría, incluido el DNI (A1,
        RN-026: el pasajero no lo puede cambiar por autoservicio). Todo o nada. No cambia el
        estado de habilitación: la baja es POST /pasajeros/{id_persona}/baja; la suspensión y la
        habilitación excepcional (RN-004/005) siguen pendientes. (CU-013, RF-002/042)
      x-cu: CU-013
      x-cobertura: parcial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasajeroUpdate'
      responses:
        '200':
          description: Pasajero actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasajeroAdmin'
        '400':
          description: VALIDACION — cuerpo vacío, campo desconocido o dato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: PASAJERO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: DNI_DUPLICADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pasajeros/{id_persona}/baja:
    post:
      tags: [administracion]
      summary: Dar de baja a un pasajero
      description: |
        Solo administrador y dueno. Baja lógica (`estado_habilitacion = baja`): no borra datos.
        Sin cuerpo: el catálogo de motivos de baja está pendiente. Repetirla responde
        PASAJERO_YA_DADO_DE_BAJA. (CU-013 A4)
      x-cu: CU-013
      x-cobertura: parcial
      parameters:
        - name: id_persona
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Pasajero dado de baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasajeroAdmin'
        '400':
          description: VALIDACION — identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: PASAJERO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: PASAJERO_YA_DADO_DE_BAJA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # CLIENTES CORPORATIVOS (administración, CU-023)
  # ---------------------------------------------------------------------------
  /clientes-corporativos:
    get:
      tags: [administracion]
      summary: Localizar clientes corporativos
      description: |
        Solo administrador y dueno. Lista paginada de empresas, con búsqueda opcional por razón
        social o CUIT (`q`, sin distinguir mayúsculas). (CU-023, RF-034)
      x-cu: CU-023
      x-cobertura: parcial
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: desplazamiento
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Empresas que coinciden, con el total sin paginar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteCorporativoLista'
        '400':
          description: VALIDACION — parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags: [administracion]
      summary: Registrar un cliente corporativo
      description: |
        Solo administrador y dueno. Crea el cliente (persona jurídica) y su condición de
        corporativo, en estado `activo`. Las condiciones comerciales no se registran acá: no hay
        un catálogo cerrado de acuerdos (RN-014). (CU-023, RF-034)
      x-cu: CU-023
      x-cobertura: parcial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteCorporativoCreate'
      responses:
        '201':
          description: Cliente corporativo registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteCorporativo'
        '400':
          description: VALIDACION — datos inválidos o faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          description: CUIT_DUPLICADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clientes-corporativos/{id_cliente}:
    parameters:
      - name: id_cliente
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [administracion]
      summary: Consultar un cliente corporativo
      description: Solo administrador y dueno. Datos de la empresa, sus contactos y sus pasajeros asociados. (CU-023 A1)
      x-cu: CU-023
      x-cobertura: parcial
      responses:
        '200':
          description: Cliente corporativo con contactos y pasajeros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteCorporativoDetalle'
        '400':
          description: VALIDACION — identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: CLIENTE_CORPORATIVO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [administracion]
      summary: Modificar un cliente corporativo
      description: |
        Solo administrador y dueno. Cambia razón social, CUIT o dirección, todo o nada. El estado
        no se cambia: no tiene catálogo aprobado. (CU-023 A1)
      x-cu: CU-023
      x-cobertura: parcial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteCorporativoUpdate'
      responses:
        '200':
          description: Cliente corporativo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteCorporativo'
        '400':
          description: VALIDACION — cuerpo vacío, campo desconocido o dato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: CLIENTE_CORPORATIVO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: CUIT_DUPLICADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clientes-corporativos/{id_cliente}/contactos:
    post:
      tags: [administracion]
      summary: Registrar un contacto de la empresa
      description: |
        Solo administrador y dueno. El contacto es una persona que ya existe (`id_persona`) o una
        nueva (nombre, apellido y DNI obligatorios). Un DNI ya registrado responde DNI_DUPLICADO:
        esa persona se indica por su id_persona. `es_representante` solo marca el dato, no da
        cuenta ni rol (CU-033). (CU-023, paso 3)
      x-cu: CU-023
      x-cobertura: parcial
      parameters:
        - name: id_cliente
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactoCorporativoCreate'
      responses:
        '201':
          description: Contacto registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactoCorporativo'
        '400':
          description: VALIDACION — se mezclan id_persona y datos, o faltan datos de la persona nueva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: CLIENTE_CORPORATIVO_NO_ENCONTRADO o PERSONA_NO_ENCONTRADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: DNI_DUPLICADO o CONTACTO_YA_REGISTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clientes-corporativos/{id_cliente}/contactos/{id_persona}:
    delete:
      tags: [administracion]
      summary: Quitar un contacto de la empresa
      description: Solo administrador y dueno. La persona sigue existiendo. (CU-023 A1)
      x-cu: CU-023
      x-cobertura: parcial
      parameters:
        - name: id_cliente
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: id_persona
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204':
          description: Contacto quitado
        '400':
          description: VALIDACION — identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: CLIENTE_CORPORATIVO_NO_ENCONTRADO o CONTACTO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clientes-corporativos/{id_cliente}/pasajeros:
    post:
      tags: [administracion]
      summary: Asociar un pasajero a la empresa
      description: |
        Solo administrador y dueno. Asocia un pasajero existente; el vínculo queda `activo`.
        Un pasajero puede estar asociado a más de una empresa. (CU-023 A2)
      x-cu: CU-023
      x-cobertura: parcial
      parameters:
        - name: id_cliente
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasajeroCorporativoCreate'
      responses:
        '201':
          description: Pasajero asociado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasajeroCorporativo'
        '400':
          description: VALIDACION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: CLIENTE_CORPORATIVO_NO_ENCONTRADO o PASAJERO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: PASAJERO_YA_ASOCIADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clientes-corporativos/{id_cliente}/pasajeros/{id_pasajero}:
    delete:
      tags: [administracion]
      summary: Desasociar un pasajero de la empresa
      description: |
        Solo administrador y dueno. Borra el vínculo (`estado_vinculo` no tiene catálogo de
        estados); el pasajero sigue existiendo con sus reservas y pagos. (CU-023 A2)
      x-cu: CU-023
      x-cobertura: parcial
      parameters:
        - name: id_cliente
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: id_pasajero
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204':
          description: Pasajero desasociado
        '400':
          description: VALIDACION — identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: CLIENTE_CORPORATIVO_NO_ENCONTRADO o VINCULO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /organizaciones:
    get:
      tags: [corporativo]
      summary: Organizaciones que represento
      description: |
        Solo `representante_corporativo`. Las empresas en las que la persona del token figura como
        contacto con `es_representante`. Sirve para conocer el `id_cliente` de las demás operaciones:
        el modelo permite representar a más de una empresa, así que no se infiere una sola. (CU-033)
      x-cu: CU-033
      x-cobertura: parcial
      responses:
        '200':
          description: Organizaciones representadas, ordenadas por razón social
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizacionLista'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /organizaciones/{id_cliente}/pasajeros:
    get:
      tags: [corporativo]
      summary: Pasajeros de mi organización
      description: |
        Solo `representante_corporativo` de esa empresa. Una empresa que no representa responde
        404 `ORGANIZACION_NO_ENCONTRADA`, igual que una inexistente (CU-033 A3). Ordenado por
        apellido, nombre e id.
      x-cu: CU-033
      x-cobertura: parcial
      parameters:
        - name: id_cliente
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: desplazamiento
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Pasajeros asociados a la empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasajeroOrganizacionLista'
        '400':
          description: VALIDACION — parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: ORGANIZACION_NO_ENCONTRADA (inexistente o no representada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [corporativo]
      summary: Registrar un pasajero en mi organización
      description: |
        Solo `representante_corporativo` de esa empresa. Crea la persona, el pasajero y su vínculo
        con la empresa en una sola transacción. Si ya existe una persona con ese DNI responde 409
        `DNI_DUPLICADO`: reutilizarla no está definido. La categoría no se carga (queda a cargo de
        administración). (CU-033, flujo principal)
      x-cu: CU-033
      x-cobertura: parcial
      parameters:
        - name: id_cliente
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasajeroOrganizacionCreate'
      responses:
        '201':
          description: Pasajero registrado y asociado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasajeroOrganizacion'
        '400':
          description: VALIDACION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: ORGANIZACION_NO_ENCONTRADA (inexistente o no representada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: DNI_DUPLICADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /organizaciones/{id_cliente}/pasajeros/{id_pasajero}:
    patch:
      tags: [corporativo]
      summary: Modificar un pasajero de mi organización
      description: |
        Solo `representante_corporativo` de esa empresa. Modifica nombre, apellido, email, teléfono
        y dirección; omitir un campo lo deja sin cambios. Un pasajero que no es de la empresa
        responde 404 `PASAJERO_NO_ENCONTRADO` sin tocar nada (CU-033 A3). Cualquier otro dato, el
        DNI en particular, responde 403 `DATO_NO_MODIFICABLE` y no modifica ninguno: el cambio lo
        hace un administrador (CU-033 A4, RN-026).
      x-cu: CU-033
      x-cobertura: parcial
      parameters:
        - name: id_cliente
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: id_pasajero
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasajeroOrganizacionUpdate'
      responses:
        '200':
          description: Pasajero modificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasajeroOrganizacion'
        '400':
          description: VALIDACION — sin datos o con datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: SIN_PERMISO (otro rol) o DATO_NO_MODIFICABLE (dato no habilitado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ORGANIZACION_NO_ENCONTRADA o PASAJERO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clientes/{id_cliente}/deuda:
    get:
      tags: [administracion]
      summary: Consultar deuda de un cliente
      description: |
        Solo administrador y dueno. Consulta derivada de movimientos, sin editar saldo
        ni inferir suspensión. Cliente sin cuenta corriente devuelve saldo 0.00 y estado
        al_dia. Cliente inexistente responde CLIENTE_NO_ENCONTRADO; otros roles SIN_PERMISO.
        RN-004/005/006 siguen pendientes de implementación. (CU-015, RF-010)
      x-cu: CU-015
      x-cobertura: parcial
      parameters:
        - name: id_cliente
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Estado de deuda derivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deuda'
        '400':
          description: VALIDACION — identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: SIN_PERMISO — requiere administrador o dueno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: CLIENTE_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pasajeros/me/deuda:
    get:
      tags: [pasajero]
      summary: Consultar deuda propia
      description: Situación de deuda del pasajero autenticado (derivada). (CU-006, RF-010)
      x-cu: CU-006
      responses:
        '200':
          description: Estado de deuda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deuda'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /pasajeros/me/reservas:
    get:
      tags: [pasajero]
      summary: Consultar reservas propias
      description: Lista de reservas del pasajero autenticado con su estado. (CU-010, RF-043)
      x-cu: CU-010
      responses:
        '200':
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reserva'

  /pasajeros/me/comprobantes:
    get:
      tags: [pasajero]
      summary: Consultar comprobantes propios
      description: |
        Solo rol pasajero. Comprobantes cuyo origen (pago, contratación o movimiento de cuenta)
        pertenece al cliente individual del pasajero autenticado, por `id_comprobante` ascendente.
        Sin cliente individual o sin comprobantes responde una lista vacía (CU-035 A1). Solo
        consulta: la descarga queda pendiente, porque la spec deja sin definir el formato de los
        documentos y las reglas fiscales. El representante corporativo (ACT-03) todavía no tiene
        operación. (CU-035, RF-037, RN-028)
      x-cu: CU-035
      x-cobertura: parcial
      responses:
        '200':
          description: Comprobantes propios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComprobantePropio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /pasajeros/me/comprobantes/{id_comprobante}:
    get:
      tags: [pasajero]
      summary: Consultar un comprobante propio
      description: |
        Solo rol pasajero. Un comprobante de otro cliente o inexistente responde el mismo 404
        `COMPROBANTE_NO_ENCONTRADO`: no se presenta ni se confirma que exista (CU-035 A2, RN-028).
        (CU-035, RF-037)
      x-cu: CU-035
      x-cobertura: parcial
      parameters:
        - name: id_comprobante
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Comprobante propio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComprobantePropio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: COMPROBANTE_NO_ENCONTRADO — inexistente o de otro cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # CHOFER (operación asignada)
  # ---------------------------------------------------------------------------
  /choferes/me/viajes:
    get:
      tags: [chofer]
      summary: Consultar viajes asignados al chofer
      description: |
        Solo rol chofer. El backend identifica al chofer mediante la sesión y devuelve
        únicamente los viajes que tiene asignados para la fecha consultada.
        Si no hay asignaciones, devuelve una lista vacía. (CU-029, RF-024, RN-029)

        El campo horario se omite cuando no tiene valor; no se devuelve null.

        El detalle operativo con paradas, pasajeros, abordajes y cantidades se
        consulta en GET /choferes/me/viajes/{id_viaje}.
      x-cu: CU-029
      parameters:
        - name: fecha
          in: query
          required: false
          schema: { type: string, format: date }
          description: Fecha de los viajes. Si se omite, se usa la fecha actual determinada por el servidor.
      responses:
        '200':
          description: Viajes asignados al chofer; lista vacía si no hay asignaciones para la fecha.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Viaje'
              example: []
        '400':
          description: Parámetro fecha inválido (VALIDACION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /choferes/me/viajes/{id_viaje}:
    get:
      tags: [chofer]
      summary: Consultar detalle operativo de un viaje asignado
      description: |
        Solo rol chofer. Devuelve información del viaje asignado al chofer
        autenticado, sin modificar datos. (CU-029, RF-024, RN-029)

        Incluye el viaje, las paradas ordenadas y dos listas separadas:
        pasajeros con reservas provisional o consolidada, e integrantes de
        la nómina del viaje. Excluye reservas cancelada.

        Para pasajeros con reserva informa identificación permitida, fotografía
        disponible y existencia de un abordaje registrado. No expone teléfono,
        email ni dirección personal. Para integrantes de nómina no atribuye
        fotografía, estado de reserva ni abordaje.

        total_reservas es la suma de consolidadas y provisionales.
        total_nomina es independiente. abordajes_registrados cuenta únicamente
        pasajeros del listado de reservas con abordaje registrado.
        No se calcula un total único de personas entre listas ni disponibilidad.
        La capacidad_planificada es el valor del viaje, que puede ser null.

        Un viaje inexistente o ajeno devuelve 404; un rol incorrecto devuelve 403.
        El campo horario se omite cuando no tiene valor. Los campos opcionales
        de Parada sin valor se omiten para respetar el schema existente.
      x-cu: CU-029
      parameters:
        - $ref: '#/components/parameters/IdViaje'
      responses:
        '200':
          description: Detalle operativo del viaje asignado; las listas pueden estar vacías.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperacionAsignada'
        '400':
          description: Identificador de viaje inválido (VALIDACION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  # ---------------------------------------------------------------------------
  # SERVICIOS / DISPONIBILIDAD / TARIFAS
  # ---------------------------------------------------------------------------
  /servicios/disponibilidad:
    get:
      tags: [servicios]
      summary: Consultar disponibilidad de cupos
      description: |
        Disponibilidad de cupos para una fecha y sentido, y opcionalmente un recorrido o una parada
        de destino. El cupo es derivado (capacidad - reservas consolidadas), evaluado por el backend
        (RN-001). (CU-002, RF-004)

        `id_parada_destino` devuelve los viajes cuyo recorrido **pasa por** esa parada (Issue #8,
        AC08-03 y AC08-05). Es la primera entrega para PC2 y **no distingue ascenso de descenso ni
        habilitaciones que cambien de un viaje a otro del mismo recorrido** (AC08-06 y AC08-07):
        un viaje cuyo recorrido incluye la parada se ofrece aunque en ese viaje no se pueda bajar
        ahí. Esa brecha queda para una tarea de modelo posterior. No se deduce de la última parada.

        `destino` (texto) sigue sin soportarse: una dirección libre no es un destino habilitado
        (AC08-02). Se informa con `FILTRO_NO_DISPONIBLE`.
      x-cu: CU-002
      security: []
      parameters:
        - name: fecha
          in: query
          required: true
          schema: { type: string, format: date }
          description: Fecha del viaje (resuelta por el backend si viene de "hoy/mañana").
        - name: sentido
          in: query
          required: true
          schema: { type: string, enum: [IDA, VUELTA] }
        - name: destino
          in: query
          required: false
          schema: { type: string }
          description: >-
            No soportado: si viene, responde `400 FILTRO_NO_DISPONIBLE`. Usar `id_parada_destino`.
        - name: id_recorrido
          in: query
          required: false
          schema: { type: integer }
        - name: id_parada_destino
          in: query
          required: false
          schema: { type: integer }
          description: >-
            Una parada de `GET /recorridos/{id_recorrido}/paradas`. Se combina con `id_recorrido`
            si viene. Si ningún viaje coincide, la respuesta es `200` con una lista vacía.
      responses:
        '200':
          description: Viajes disponibles con su cupo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disponibilidad'
        '400':
          description: >-
            `FILTRO_NO_DISPONIBLE` si viene `destino` (texto), o `PARADA_NO_VALIDA` si
            `id_parada_destino` no corresponde a una parada existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /servicios:
    get:
      tags: [servicios]
      summary: Listar servicios
      description: Servicios ofrecidos (universitario, laboral, corporativo, especial). (CU-002)
      x-cu: CU-002
      security: []
      responses:
        '200':
          description: Lista de servicios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Servicio'

  /recorridos/{id_recorrido}/paradas:
    get:
      tags: [servicios]
      summary: Consultar paradas de un recorrido
      description: Paradas del recorrido en orden. (CU-002, RF-019)
      x-cu: CU-002
      security: []
      parameters:
        - $ref: '#/components/parameters/IdRecorrido'
      responses:
        '200':
          description: Paradas del recorrido
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /tarifas:
    get:
      tags: [servicios]
      summary: Consultar tarifa aplicable
      description: |
        Determina la tarifa según tipo de cliente, modalidad, días y medio de pago
        (incluye descuento 15% efectivo, RN-011). (RF-028; se usa como paso previo de CU-003)
      x-rf: RF-028
      parameters:
        - name: tipo_cliente
          in: query
          required: true
          schema: { type: string }
        - name: modalidad
          in: query
          required: true
          schema: { type: string, enum: [IDA, VUELTA, IDA_VUELTA] }
        - name: dias
          in: query
          required: false
          schema: { type: integer }
        - name: medio_pago
          in: query
          required: false
          schema: { type: string, enum: [EFECTIVO, TRANSFERENCIA, BILLETERA, CUENTA_CORRIENTE, MERCADO_PAGO] }
      responses:
        '200':
          description: Tarifa aplicable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarifa'

  # ---------------------------------------------------------------------------
  # RESERVAS
  # ---------------------------------------------------------------------------
  /reservas:
    get:
      tags: [reservas]
      summary: Consultar reservas (administración)
      description: |
        Lista para administración y dueño todas las reservas, provisionales, consolidadas y
        canceladas, con el mismo schema `Reserva` (incluye `id_pasajero`). Se ordena por
        `id_reserva` ascendente; sin reservas responde 200 con una lista vacía. Es de solo lectura,
        no filtra ni pagina y no devuelve nombres, contactos ni importes. Los criterios de búsqueda
        adicionales de CU-027 quedan pendientes. No cambia las consultas del pasajero: las propias
        siguen en `GET /pasajeros/me/reservas`. (CU-027)
      x-cu: CU-027
      x-cobertura: parcial
      responses:
        '200':
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags: [reservas]
      summary: Crear reserva
      description: |
        Crea una reserva si hay cupo (RN-001) y se cumplen las reglas (RN-031: no dos idas
        ni dos vueltas el mismo día). Distingue provisional vs consolidada (RN-002). (CU-003, RF-005)
      x-cu: CU-003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaCreate'
      responses:
        '201':
          description: Reserva creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          description: >-
            Cuerpo inválido, o `orden_parada` que no pertenece al recorrido del viaje
            (`PARADA_NO_VALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: >-
            Sin cupo (`CUPO_NO_DISPONIBLE`), reserva duplicada para esa fecha y sentido
            (`RESERVA_DUPLICADA_DEL_DIA`, RN-031), reserva cancelada previa del mismo viaje
            (`RESERVA_CANCELADA_PREVIA`) o viaje que no admite reservas (`VIAJE_NO_RESERVABLE`).
            Cuando no hay cupo, `detalles.lista_espera` es `true`: informa que existe lista de
            espera; la incorporación y la gestión de esa lista NO tienen operación en esta versión
            (cobertura parcial de CU-003, se completa en v0.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reservas/{id_reserva}:
    get:
      tags: [reservas]
      summary: Consultar una reserva
      description: Detalle y estado de una reserva propia/autorizada. (CU-010, RF-043)
      x-cu: CU-010
      parameters:
        - $ref: '#/components/parameters/IdReserva'
      responses:
        '200':
          description: Reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /reservas/{id_reserva}/cancelacion:
    post:
      tags: [reservas]
      summary: Cancelar reserva
      description: |
        Cancela la reserva y aplica la consecuencia económica según el tipo de servicio
        (RN-017/018/019). Libera el cupo cuando corresponde. (CU-004, RF-006)
      x-cu: CU-004
      parameters:
        - $ref: '#/components/parameters/IdReserva'
      responses:
        '200':
          description: Reserva cancelada, con la consecuencia económica aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCancelacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: >-
            La reserva no está en un estado cancelable: ya estaba cancelada
            (`RESERVA_NO_CANCELABLE`) o su viaje ya no está programado (`VIAJE_NO_CANCELABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reservas/{id_reserva}/cambio-parada:
    post:
      tags: [reservas]
      summary: Solicitar cambio de parada
      description: |
        Cambia la parada de ascenso de una reserva propia, sujeto a disponibilidad compatible
        (RN-020). (CU-005, RF-008)

        Con el modelo actual la capacidad se calcula por viaje y la reserva ya ocupa su lugar en él:
        cambiar de parada dentro del mismo viaje mantiene horario, recorrido y unidad y no consume
        otro lugar. Es compatible la parada que pertenece al recorrido del viaje. Interpretación
        mínima, pendiente de validación del equipo (Issue #242). Solo se cambia la parada de una
        reserva no cancelada de un viaje todavía `programado`. Si el cambio no procede, la parada
        original se conserva (A1). No lo ofrece el chatbot: CU-005 no lo asigna a ese canal.
      x-cu: CU-005
      parameters:
        - $ref: '#/components/parameters/IdReserva'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orden_parada]
              properties:
                orden_parada:
                  type: integer
                  minimum: 1
                  description: Orden de la nueva parada dentro del recorrido.
      responses:
        '200':
          description: Cambio de parada confirmado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          description: >-
            Cuerpo inválido, o `orden_parada` que no pertenece al recorrido del viaje
            (`PARADA_NO_VALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: >-
            Sin disponibilidad compatible: la reserva está cancelada (`RESERVA_NO_MODIFICABLE`),
            el viaje ya no está programado (`VIAJE_NO_MODIFICABLE`) o la reserva ya tiene esa
            parada (`PARADA_SIN_CAMBIOS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # ABORDAJE Y AUSENCIAS
  # ---------------------------------------------------------------------------
  /abordajes:
    post:
      tags: [abordaje]
      summary: Registrar abordaje por QR
      description: |
        Registra el abordaje al escanear el QR del vehículo. Valida servicio, parada,
        horario y habilitación (RN-023). Admite registro offline con sincronización
        posterior sin duplicados (RNF-011/012). (CU-007, RF-014/015)
      x-cu: CU-007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbordajeCreate'
      responses:
        '201':
          description: Abordaje registrado (o encolado para sincronizar si vino offline)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abordaje'
        '409':
          description: Abordaje no válido (habilitación / servicio / parada / horario) o duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ausencias:
    post:
      tags: [abordaje]
      summary: Informar ausencia
      description: |
        CU-008 / RF-016 / RN-024/025. Solo pasajero autenticado; la identidad sale
        de la sesión, nunca del cuerpo. Cada ausencia es un aviso voluntario:
        no se genera por falta de abordaje ni representa una inasistencia inferida.

        Un aviso nuevo exige reserva propia consolidada, viaje programado o en_curso
        y ningún abordaje registrado del pasajero en ese viaje. Devuelve 201.
        Tras autenticar y verificar pertenencia, un aviso propio existente tiene
        prioridad sobre esas condiciones: devuelve 200 con la misma fila, incluso
        si luego se canceló la reserva o el viaje, o se finalizó el viaje.
        No duplica eventos ni otros efectos. Los avisos concurrentes se serializan.

        No modifica la reserva ni aplica efectos económicos. La disponibilidad ya
        excluye reservas consolidadas con ausencia; no se incrementa un contador.
        Recuperar el lugar queda fuera de alcance y escanear no lo recupera automáticamente.
        El aviso no es obligatorio.
      x-cu: CU-008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_viaje]
              properties:
                id_viaje: { type: integer }
      responses:
        '200':
          description: Aviso propio existente, sin nuevos efectos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ausencia'
        '201':
          description: Ausencia voluntaria registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ausencia'

        '400':
          description: 'VALIDACION: cuerpo invalido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'NO_AUTENTICADO: token ausente o invalido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'SIN_PERMISO: requiere rol pasajero.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'RESERVA_NO_ENCONTRADA: sin reserva propia, tambien ante viaje inexistente. No revela reservas ajenas.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Solo sin aviso previo, en este orden: RESERVA_NO_CONSOLIDADA (provisional o cancelada), VIAJE_NO_ADMITE_AUSENCIA (finalizado o cancelado), PASAJERO_YA_ABORDADO (existe abordaje propio en el viaje).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # GPS
  # ---------------------------------------------------------------------------
  /viajes/{id_viaje}/ubicacion:
    get:
      tags: [gps]
      summary: Consultar última ubicación del vehículo
      description: |
        Requiere autenticación bearer (401 NO_AUTENTICADO sin token válido).
        Administrador y dueño conservan acceso por rol. El pasajero autenticado debe
        tener una reserva propia consolidada del mismo viaje (RN-030); se consulta
        primero esa reserva, sin bloquearla. Sin reserva propia consolidada se responde
        403 SIN_PERMISO sin coordenadas, incluso si el viaje no existe o no está en_curso.
        Una reserva ajena, provisional o cancelada no habilita. Ausencia y abordaje
        no agregan restricciones. El rol chofer por sí solo no habilita este GET.

        Después de autorizar, si el viaje no existe o no está en_curso se responde
        404 VIAJE_NO_DISPONIBLE. Solo para un viaje en_curso autorizado, si falta una
        posición completa se responde 404 UBICACION_NO_DISPONIBLE. Esa es la precedencia:
        autenticación, permiso, disponibilidad del viaje y disponibilidad de posición.

        Marca "desactualizada" si supera 30 s (RNF-008).
        fecha_hora_evaluacion es opcional por compatibilidad. Si se entrega, es el
        instante UTC S tomado una sola vez para esta evaluacion, sobre el mismo
        snapshot de posicion devuelto: desactualizada = (S - fecha_hora_posicion > 30 s).
        fecha_hora_posicion conserva su significado contractual y politica vigente;
        S no certifica captura fisica, recepcion del cliente ni demora unidireccional.
        Cada 200 se genera fresco con Cache-Control: no-store. Una respuesta
        reutilizada desde cache no constituye una nueva referencia temporal.
        Sin S valido no se infiere vigencia desde false ni desde el reloj del cliente;
        true conserva su significado de desactualizacion acreditada por el servidor.
        Consumidores hacen polling (~10 s, RNF-007). (CU-009, RF-022)
        COBERTURA PARCIAL: ETA todavía no está implementado; eta_minutos es null.
        No acredita continuidad GPS ni cumplimiento de RNF-008.
      x-cu: CU-009
      x-cobertura: parcial
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdViaje'
      responses:
        '200':
          description: Última ubicación del vehículo; eta_minutos es null mientras ETA no esté implementado.
          headers:
            Cache-Control:
              description: Respuesta fresca; no almacenar ni reutilizar como evaluacion nueva.
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ubicacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: SIN_PERMISO. Rol no autorizado o pasajero sin reserva propia consolidada; precede a ambos 404 y no expone coordenadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: VIAJE_NO_DISPONIBLE si el viaje no existe o no está en_curso; de lo contrario UBICACION_NO_DISPONIBLE si falta una posición completa. Solo después de autorizar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [chofer]
      summary: Enviar ubicación del viaje
      description: |
        Solo rol chofer. El viaje debe pertenecer al chofer autenticado
        y estar en_curso. (CU-030, RF-021, RF-025)

        Si el dispositivo omite la fecha/hora de posición o envía una futura respecto
        del servidor, se utiliza la hora actual del servidor como timestamp efectivo.
        Si envía una fecha/hora anterior a la del servidor, se conserva esa marca temporal.

        La posición se actualiza únicamente si el timestamp efectivo es estrictamente
        posterior al almacenado. Si es igual o anterior, se ignora la nueva posición:
        no se modifican las coordenadas ni el timestamp guardados.
        Se conserva únicamente la última posición por viaje, sin historial.

        La respuesta informa si la posición se actualizó y la fecha/hora que
        efectivamente permanece almacenada, incluso si se ignoró la posición enviada.

        La precisión de 50 metros es un objetivo, no una causa automática de rechazo.
        Aplican RNF-007 a RNF-010.

        COBERTURA PARCIAL de CU-030: los avisos de demora y problemas quedan
        pendientes para otra tarea.
      x-cu: CU-030
      x-cobertura: parcial
      parameters:
        - $ref: '#/components/parameters/IdViaje'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosicionGpsCreate'
      responses:
        '200':
          description: Resultado del procesamiento y fecha/hora de la posición conservada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoPosicionGps'
              examples:
                actualizada:
                  summary: Posición actualizada
                  value:
                    actualizada: true
                    fecha_hora_posicion: '2026-10-15T16:30:00Z'
                ignorada:
                  summary: Posición ignorada; se conserva la almacenada
                  value:
                    actualizada: false
                    fecha_hora_posicion: '2026-10-15T16:30:00Z'
        '400':
          description: Identificador, coordenadas o formato de fecha inválidos (VALIDACION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El viaje no está en_curso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # PAGOS (administración)
  # ---------------------------------------------------------------------------
  /pagos:
    post:
      tags: [pagos]
      summary: Registrar un pago
      description: |
        Registra un pago total/parcial/seña asociado a un cliente o pasajero. Puede pagar
        un tercero (RN-016). El registro NO confirma el pago (ver /confirmacion). (CU-014, RF-009)

        Lo registran administración (indica `id_cliente`) o el propio pasajero (pantalla 5 del
        PC1): para él se usa la cuenta corriente de su cliente individual y no puede registrar
        pagos de otro cliente.
      x-cu: CU-014
      x-cobertura: parcial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagoCreate'
      responses:
        '201':
          description: Pago registrado (estado PENDIENTE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
        '400':
          description: >-
            Cuerpo inválido, administración sin `id_cliente`, o `tipo`/`evidencia_pago`, que todavía
            no se pueden conservar (VALIDACION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          description: >-
            El cliente no existe (`CLIENTE_NO_ENCONTRADO`; para el pasajero, no tiene cliente
            individual) o no tiene cuenta corriente (`CUENTA_CORRIENTE_NO_ENCONTRADA`). Vale para
            el `id_cliente` que indica administración y para la cuenta propia del pasajero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pagos/pendientes:
    get:
      tags: [pagos]
      summary: Consultar pagos pendientes de decisión administrativa
      description: |
        Solo administrador o dueño. Devuelve únicamente pagos PENDIENTE, ordenados por
        fecha_hora e id_pago ascendentes. Lista vacía si no hay pendientes. No modifica
        pagos ni genera movimientos o comprobantes. Complementa CU-016/RF-011/RN-015;
        los pagos ya confirmados automáticamente quedan excluidos por su estado.
      x-cu: CU-016
      responses:
        '200':
          description: Pagos pendientes de decisión.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pago'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /pagos/{id_pago}/confirmacion:
    post:
      tags: [pagos]
      summary: Confirmar o rechazar un pago
      description: |
        Permite a una persona autorizada confirmar o rechazar un pago cuya
        acreditación no haya sido validada automáticamente por un proveedor
        integrado. No se utiliza para volver a validar pagos ya confirmados
        automáticamente mediante Mercado Pago. Una decisión CONFIRMADO sobre medio
        MERCADO_PAGO devuelve 409: solo el proveedor puede acreditarlo. El agente IA nunca confirma pagos.
        Un pago CONFIRMADO genera un comprobante RECIBO. (CU-016, RF-011, RN-015)
      x-cu: CU-016
      parameters:
        - $ref: '#/components/parameters/IdPago'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [CONFIRMADO, RECHAZADO] }
      responses:
        '200':
          description: Estado del pago actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Mercado Pago requiere validación automática del proveedor (`PAGO_MP_REQUIERE_PROVEEDOR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # VEHÍCULOS (administración)
  # ---------------------------------------------------------------------------
  /vehiculos:
    get:
      tags: [vehiculos]
      summary: Consultar vehículos
      description: |
        Lista los vehículos por identificador para administración y dueño. No calcula
        disponibilidad ni expone documentación todavía no modelada. (CU-022, RF-026)
      x-cu: CU-022
      x-cobertura: parcial
      responses:
        '200':
          description: Vehículos registrados; lista vacía si no hay resultados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehiculo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags: [vehiculos]
      summary: Registrar un vehículo
      description: |
        Registra los campos existentes del modelo: patente, marca, modelo, capacidad y
        disponibilidad. No crea documentación ni modifica asignaciones. (CU-022, RF-026)
      x-cu: CU-022
      x-cobertura: parcial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiculoCreate'
      responses:
        '201':
          description: Vehículo registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehiculo'
        '400':
          description: Campo ausente, desconocido o inválido (VALIDACION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          description: Ya existe otro vehículo con la patente (PATENTE_DUPLICADA).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vehiculos/{id_vehiculo}:
    parameters:
      - name: id_vehiculo
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [vehiculos]
      summary: Consultar un vehículo
      description: Consulta los campos disponibles de un vehículo. (CU-022, RF-026)
      x-cu: CU-022
      x-cobertura: parcial
      responses:
        '200':
          description: Vehículo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehiculo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    patch:
      tags: [vehiculos]
      summary: Modificar un vehículo
      description: |
        Modifica solamente los campos persistidos por el modelo vigente. La disponibilidad
        se almacena como fue informada, sin inferir efectos sobre viajes. (CU-022, RF-026)
      x-cu: CU-022
      x-cobertura: parcial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiculoUpdate'
      responses:
        '200':
          description: Vehículo actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehiculo'
        '400':
          description: Cuerpo vacío, campo desconocido o valor inválido (VALIDACION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Ya existe otro vehículo con la patente (PATENTE_DUPLICADA).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # VIAJES (administración)
  # ---------------------------------------------------------------------------
  /viajes:
    get:
      tags: [viajes]
      summary: Consultar viajes del día
      description: |
        Lista para administración todos los viajes de la fecha indicada, incluidos los estados
        programado, en_curso, finalizado y cancelado. Las asignaciones de vehículo o chofer pueden
        estar pendientes durante la planificación (ADJ-03). El resultado se ordena por horario
        ascendente, con los viajes sin horario al final, y luego por id_viaje ascendente. (CU-018)
      x-cu: CU-018
      x-cobertura: parcial
      parameters:
        - name: fecha
          in: query
          required: true
          description: Fecha de los viajes.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Viajes del día; lista vacía si no hay resultados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Viaje'
        '400':
          description: Fecha ausente, vacía, imposible o con formato incorrecto (VALIDACION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags: [viajes]
      summary: Crear un viaje
      description: |
        Crea un viaje con fecha, horario, recorrido y capacidad. Durante la planificación,
        vehículo y/o chofer pueden quedar pendientes; ambos deben estar asignados antes de
        iniciar la ejecución. Verifica capacidad vs pasajeros cuando exista un vehículo
        asignado (RN-001). (CU-018, RF-017/018)

        COBERTURA PARCIAL de CU-018: esta versión del contrato cubre la creación y la
        actualización de los campos que no alteran las reservas. La cancelación queda pendiente.
      x-cu: CU-018
      x-cobertura: parcial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViajeCreate'
      responses:
        '201':
          description: Viaje creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viaje'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /viajes/{id_viaje}:
    patch:
      tags: [viajes]
      summary: Actualizar un viaje programado
      description: |
        Solo administrador o dueño. Modifica fecha, horario, sentido, capacidad planificada y
        asignaciones de vehículo o chofer mientras el viaje permanezca programado. Vehículo y
        chofer pueden volver a quedar pendientes durante la planificación (ADJ-03). La capacidad
        efectiva no puede ser menor que los lugares ocupados por reservas vigentes (RN-001).

        Servicio y recorrido no se aceptan: el contrato vigente no define cómo migrar las
        contrataciones, paradas y reservas vinculadas. No detecta solapamientos de vehículo o
        chofer porque esas reglas continúan pendientes de definición. (CU-018, RF-017/018)
      x-cu: CU-018
      x-cobertura: parcial
      parameters:
        - $ref: '#/components/parameters/IdViaje'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViajeUpdate'
      responses:
        '200':
          description: Viaje actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viaje'
        '400':
          description: Cuerpo vacío, campo desconocido o valor inválido (VALIDACION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Estado del viaje inválido o capacidad insuficiente para sus reservas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # VIAJES (ejecución — chofer)
  # ---------------------------------------------------------------------------
  /viajes/{id_viaje}/cancelacion:
    post:
      tags: [viajes]
      summary: Cancelación lógica limitada de viaje (propuesta PC2)
      description: |
        Propuesta local #180: recorte acordado con Martiniano según la indicación del equipo;
        confirmación final de Martín pendiente. Solo administrador o dueño, viaje programado,
        excluidos servicios ESPECIAL/CORPORATIVO. Rechaza reservas provisional/consolidada,
        cualquier vínculo periodo_abono_viaje y lista de espera con estado exacto en_espera.
        Cambia estado a cancelado sin borrar registros, con bloqueo del viaje y evento atómico.
        RN-019 no implementada; CU-017/#75 pendiente. CU-018 mantiene cobertura parcial.
        VIAJE_CON_COMPROMISOS es un código propuesto pendiente de confirmación final.
      x-cu: CU-018
      x-cobertura: parcial
      x-estado-aprobacion: pendiente-confirmacion-Martin
      parameters:
        - $ref: '#/components/parameters/IdViaje'
      responses:
        '200':
          description: Viaje cancelado lógicamente, sin reintegros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viaje'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: ESTADO_VIAJE_INVALIDO (estado o servicio excluido) o VIAJE_CON_COMPROMISOS (propuesto).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /viajes/{id_viaje}/inicio:
    post:
      tags: [chofer]
      summary: Iniciar un viaje asignado
      description: |
        Solo rol chofer. Para un inicio normal, el viaje debe pertenecer al chofer
        autenticado, tener chofer y vehículo asignados y estar programado.
        Cambia el estado de programado a en_curso. (CU-030, RF-025, ADJ-03)

        Un reintento con el viaje en_curso devuelve 200 con su estado actual,
        sin modificarlo nuevamente ni duplicar eventos. Si el viaje ya está
        finalizado, devuelve 200 con estado finalizado por idempotencia:
        no lo reinicia ni lo cambia a en_curso, y no genera otro evento de inicio.

        Un viaje cancelado no puede iniciarse y devuelve 409. Un viaje inexistente
        o ajeno devuelve 404; un rol incorrecto devuelve 403.
        El campo horario se omite cuando no tiene valor.

        COBERTURA PARCIAL de CU-030: los avisos de demora y problemas quedan
        pendientes para otra tarea.
      x-cu: CU-030
      x-cobertura: parcial
      parameters:
        - $ref: '#/components/parameters/IdViaje'
      responses:
        '200':
          description: Viaje iniciado o estado actual sin cambios ante un reintento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viaje'
        '400':
          description: Identificador de viaje inválido (VALIDACION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El viaje está cancelado o falta el vehículo requerido para iniciar (ADJ-03).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /viajes/{id_viaje}/finalizacion:
    post:
      tags: [chofer]
      summary: Finalizar un viaje asignado
      description: |
        Solo rol chofer. El viaje debe pertenecer al chofer autenticado.
        La finalización normal cambia el estado de en_curso a finalizado.
        (CU-030, RF-025)

        Si ya está finalizado, devuelve 200 con estado finalizado,
        sin modificarlo nuevamente ni duplicar eventos.
        Los permisos se comprueban también en los reintentos.

        Un viaje programado o cancelado devuelve 409.
        Un viaje inexistente o ajeno devuelve 404;
        un rol incorrecto devuelve 403.
        El campo horario se omite cuando no tiene valor.

        COBERTURA PARCIAL de CU-030: los avisos de demora y problemas
        quedan pendientes para otra tarea.
      x-cu: CU-030
      x-cobertura: parcial
      parameters:
        - $ref: '#/components/parameters/IdViaje'
      responses:
        '200':
